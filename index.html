<!doctype html>
<html lang="ja">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>簡易ピアノアプリ</title>
	<link rel="stylesheet" href="src/ui/base.css">
	<link rel="stylesheet" href="src/ui/header/header.css">
	<link rel="stylesheet" href="src/ui/header/volumeController.css">
	<link rel="stylesheet" href="src/ui/settings/settingsPanel.css">
	<link rel="stylesheet" href="src/ui/notes/noteDisplay.css">
	<link rel="stylesheet" href="src/ui/notes/noteLabel.css">
	<link rel="stylesheet" href="src/ui/instrument/instrumentKey.css">
	<link rel="stylesheet" href="src/ui/instrument/keyboardView.css">
	<link rel="stylesheet" href="src/ui/instrument/fretboardView.css">
	<link rel="stylesheet" href="src/ui/layout.css">
	<script type="module" src="src/main.js"></script>
</head>

<body>
	<header>
		<div class="volume-control">
			<label for="volume">音量</label>
			<input type="range" id="volume" class="volume-slider" min="0" max="100" value="20" />
		</div>
		<button class="settings-open-button" aria-label="設定">⚙</button>

		<div class="settings-panel">

			<div class="settings-panel-header">
				<button class="settings-close-button" aria-label="閉じる">>>

				</button>
			</div>

			<div class="settings-section" data-section="tuning">
				<button class="settings-section-header">音律</button>
				<div class="settings-section-body">
					<div class="settings-row">
						<label for="a4-frequency">基準周波数(A4)</label>
						<input type="number" id="a4-frequency" min="400" max="480" step="0.1" value="440">
					</div>
					<div class="settings-row">
						<label for="temperament">音律方式</label>
						<select id="temperament">
							<option value="equal">平均律</option>
							<option value="just" disabled>純正律(準備中)</option>
						</select>
					</div>
				</div>
			</div>

			<div class="settings-section" data-section="synth">
				<button class="settings-section-header">音色</button>
				<div class="settings-section-body">
					<div class="settings-row">
						<label for="waveform">波形</label>
						<select id="waveform">
							<option value="sine">サイン波</option>
							<option value="square" selected>矩形波</option>
							<option value="sawtooth">のこぎり波</option>
							<option value="triangle">三角波</option>
						</select>
					</div>
				</div>
			</div>

			<div class="settings-section" data-section="notation">
				<button class="settings-section-header">表記</button>
				<div class="settings-section-body">
					<div class="settings-row">
						<label for="notation">音名表記</label>
						<select id="notation">
							<option value="doremi">ドレミ</option>
							<option value="chromaticSolfege">クロマティック・ソルフェージュ</option>
							<option value="abcd">ABCD</option>
							<option value="iroha">いろは</option>
						</select>
					</div>
				</div>
			</div>

			<div class="settings-section" data-section="keyboard-view">
				<button class="settings-section-header">鍵盤</button>
				<div class="settings-section-body">
					<div class="settings-row">
						<label for="keyboard-layout">レイアウト</label>
						<select id="keyboard-layout">
							<option value="linear">一列</option>
							<option value="fretboard">フレットボード</option>
						</select>
					</div>
				</div>
			</div>
		</div>

	</header>

	<div class="instrument-area">
		<div class="note-display">
		</div>
		<div class="keyboard"></div>
		<div class="fretboard is-hidden"></div>
	</div>

</body>

</html>
