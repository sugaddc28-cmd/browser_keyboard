<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>簡易ピアノアプリ</title>
		<link rel="stylesheet" href="style/base.css">
		<link rel="stylesheet" href="style/header.css">
		<link rel="stylesheet" href="style/settingsPanel.ss">
		<link rel="stylesheet" href="style/mainObject.css">
    <script type="module" src="js/main.js"></script>

  <body>
    <header>
      <div class="volume_control">
        <label for="volume">音量</label>
        <input
          type="range"
          id="volume"
          class="volume_slider"
          min="0"
          max="100"
          value="20"
        />
      </div>
			<button class="settings_button" aria-label="設定">⚙</button>
    </header>
    
		<div class="main_object">
			<div class="display_note">
				<h1></h1>
			</div>
			<div class="keyboard"></div>
		</div>

  </body>
</html>
