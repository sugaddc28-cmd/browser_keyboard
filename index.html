<!doctype html>
<html lang="ja">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>簡易ピアノアプリ</title>
	<link rel="stylesheet" href="style/base.css">
	<link rel="stylesheet" href="style/header.css">
	<link rel="stylesheet" href="style/settingsPanel.css">
	<link rel="stylesheet" href="style/mainObject.css">
	<script type="module" src="js/main.js"></script>
</head>

<body>
	<header>
		<div class="volume_control">
			<label for="volume">音量</label>
			<input type="range" id="volume" class="volume_slider" min="0" max="100" value="20" />
		</div>
		<button class="settings_button" aria-label="設定">⚙</button>

		<div class="settings_panel">

			<div class="settings_panel_header">
				<button class="settings_panel_close" aria-label="閉じる">>>

				</button>
			</div>

			<div class="settings_section" data-section="tuning">
				<button class="settings_section_header">音律</button>
				<div class="settings_section_body">
					<div class="settings_row">
						<label for="a4-freq">基準周波数(A4)</label>
						<input type="number" id="a4-freq" min="400" max="480" step="0.1" value="440">
					</div>
					<div class="settings_row">
						<label for="temperament">音律方式</label>
						<select id="temperament">
							<option value="equal">平均律</option>
							<option value="just" disabled>純正律(準備中)</option>
						</select>
					</div>
				</div>
			</div>

			<div class="settings_section" data-section="synth">
				<button class="settings_section_header">音色</button>
				<div class="settings_section_body">
					<div class="settings_row">
						<label for="waveform">波形</label>
						<select id="waveform">
							<option value="sine">サイン波</option>
							<option value="square" selected>矩形波</option>
							<option value="sawtooth">のこぎり波</option>
							<option value="triangle">三角波</option>
						</select>
					</div>
				</div>
			</div>

			<div class="settings_section" data-section="notation">
				<button class="settings_section_header">表記</button>
				<div class="settings_section_body">
					<div class="settings_row">
						<label for="notation">音名表記</label>
						<select id="notation">
							<option value="doremi">ドレミ</option>
							<option value="abcd" disabled>ABCD(準備中)</option>
							<option value="iroha" disabled>いろは(準備中)</option>
						</select>
					</div>
				</div>
			</div>
		</div>
	</header>

	<div class="main_object">
		<div class="display_note">
			<h1></h1>
		</div>
		<div class="keyboard"></div>
	</div>

</body>

</html>
